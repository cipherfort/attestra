{{- if .Values.migrate.enabled }}
# Runs before every install and upgrade: forward-only migrations, the governed configuration, and the per-process
# login passwords taken from the database-url-<process> secrets (so the Secret stays the source of truth).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aap.fullname" . }}-migrate
  labels: {{- include "aap.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "aap.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- include "aap.podSpec" (dict "ctx" . "component" "migrate" "keys" "migrate" "dbKey" "database-url"
          "args" (list "sh" "-c" "aap migrate && aap config load --git-sha $(cat /app/.build-sha 2>/dev/null || echo image) && aap db provision-logins all --from-store")
          "resources" .Values.worker.resources) | nindent 6 }}
{{- end }}
