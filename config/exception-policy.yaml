# Security exception policy (ADR-021, governance model §4). Enforced by the workflow engine.
# Status: PROPOSED. REQUIRES HUMAN APPROVAL (CISO).
# Per-control max durations in the catalogue (exception.max_days) apply in addition; the SHORTER wins.

version: 1

approver_roles: [ciso, head_of_appsec, unit_security_lead, appsec_engineer]

approval_matrix:                # residual priority → tier → minimum approver role
  P1: { 1: ciso,                      2: ciso,                      3: head_of_appsec,            4: head_of_appsec }
  P2: { 1: head_of_appsec,            2: head_of_appsec,            3: unit_security_lead, 4: unit_security_lead }
  P3: { 1: head_of_appsec,            2: unit_security_lead, 3: unit_security_lead, 4: appsec_engineer }
  P4: { 1: unit_security_lead, 2: appsec_engineer,           3: appsec_engineer,           4: appsec_engineer }

platform_roles:                 # platform role (api/policy.py) → approver role above. Map security_leadership to
  appsec_engineer: appsec_engineer   # ciso if your CISO approves in the platform; until then P1 Tier 1/2 exceptions
  unit_lead: unit_security_lead      # cannot be approved here at all (fail closed).
  security_leadership: head_of_appsec

role_rank:                      # a higher-ranked approver may always approve
  ciso: 4
  head_of_appsec: 3
  unit_security_lead: 2
  appsec_engineer: 1

max_duration_days: { P1: 30, P2: 90, P3: 180, P4: 365 }
max_renewals: { P1: 1, P2: 2, P3: 2, P4: 2 }
renewal_escalation: one_level_up_after_max   # beyond max_renewals the next approver level is required

business_owner_cosign_tiers: [1, 2]

segregation_of_duties:
  approver_must_not_be: [requester, technical_owner, owning_team_member]

on_expiry:
  create_finding_type: exception_expired
  sla_factor: 0.5               # half the normal remediation SLA for the original priority
  notify: [owner, approver, unit_security_lead]
  reopen_target: true

review_reminders_days_before_expiry: [30, 14, 3]

required_fields: [justification, risk_description, residual_priority, remediation_plan, owner, expires_at]
compensating_control_max_impact_reduction: 1   # risk model impact levels (ADR-011)
