# SAMM target maturity profile per application tier (methodology section A.3, roadmap 18-month table).
# Default targets: agree them with whoever governs your security programme, then adapt them.
# Values are practice scores on SAMM's 0–3 scale. Application-scope practices only; Governance practices
# (G-SM, G-PC, G-EG) are assessed at organisation scope and have organisation targets below.
# "% of Tier 1 apps meeting target" = all listed practices ≥ target.

version: 1
horizon: 18 months from programme start

