# Internal Application Security Control Catalogue: SOURCE OF TRUTH.
# Status: DESIGNED (v1 draft). Control content REQUIRES HUMAN APPROVAL by the Control Catalogue Owner
# (Head of AppSec) before it drives any reporting. Changes are made by PR only; the evaluator loads the
# catalogue by git SHA, and every control evaluation records the catalogue version it used (ADR-016, T-12).
#
# Validate + render:   python3 tools/catalogue/validate.py   (renders docs/standards/control-catalogue.md)
#
# Mapping conventions
#   samm:  {stream: <id from catalogue/frameworks/samm.yaml>, level: 1..3}. Shows which SAMM activity this
#          control provides evidence FOR. Does NOT mean this control alone satisfies the activity.
#   asvs:  ASVS 5.0 chapter-level references (V1..V17). Requirement-level mapping is imported from the
#          official ASVS 5.0 release (backlog E12-F01) — not hand-transcribed here.
#   ssdf:  NIST SP 800-218 v1.1 task IDs.   csf: NIST CSF 2.0 subcategory IDs.
#   Everything under `mappings` is a framework reference; everything else in a control is ORGANISATION-SPECIFIC.
#
# Requirement levels per tier:  mandatory | recommended | n/a
# min_confidence: lowest evidence confidence that can satisfy the control (see config/evidence-types.yaml)
# Applicability conditions refer to application profile facts derived from application.yaml + discovery.

catalogue_version: 0.1.0

defaults:
  owner: appsec-governance
  review_months: 12
  exception:
    allowed: true
    max_days: { 1: 90, 2: 180, 3: 365, 4: 365 }

controls:

  # ───────────────────────────── GOV: Governance & registration ─────────────────────────────

  - id: ASC-GOV-01
    title: Application is registered with accountable owners
    domain: GOV
    objective_type: configuration
    description: >
      The application has a schema-valid .security/application.yaml in its primary repository (or a registry
      entry for apps without a repo). Business owner and technical owner resolve to active identities, and
      every repository implementing the app is linked.
    rationale: Without ownership and linkage nothing else can be attributed, prioritised or escalated.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory } }
    mappings:
      samm: [ { stream: D-TA-A, level: 1 } ]
      ssdf: [ PO.2.1 ]
      csf: [ ID.AM-02, GV.RR-02 ]
    assessment:
      mode: automated
      evaluator: registry_complete@1
      evidence_types: [ registry.application ]
      min_confidence: C1
      params: { owners_must_resolve: true, max_unlinked_repos: 0 }
    proof: >
      The GitHub connector reads application.yaml daily and on push, validates it against the schema, and
      resolves owners against Entra ID and GitHub teams. Departed owners fail the control within 24h.
    implementation: Merge the onboarding PR raised by the platform; complete owner and classification fields.
    remediation: Update owners in application.yaml; the control re-evaluates on push.
    exception: { allowed: false }

  - id: ASC-GOV-02
    title: Application classification is current and approved
    domain: GOV
    objective_type: process
    description: >
      The tier is computed by the classification model from current inputs, approved by AppSec for Tier 1/2,
      and reviewed at least every 12 months or when a classification input changes.
    rationale: The tier determines every other control requirement; a stale tier silently under-protects.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory } }
    mappings:
      samm: [ { stream: D-TA-A, level: 2 }, { stream: D-TA-A, level: 3 } ]
      csf: [ ID.AM-05 ]
    assessment:
      mode: hybrid
      evaluator: classification_current@1
      evidence_types: [ registry.classification ]
      min_confidence: { 1: M2, 2: M2, 3: M1, 4: M1 }
    proof: >
      The classification record stores inputs, model version, computed tier, approver and date. The
      event_bound freshness policy invalidates it when application.yaml classification inputs change.
    implementation: Answer the classification questions in application.yaml; AppSec approves Tier 1/2 in the platform.
    remediation: Re-attest classification in the platform; changes in tier re-baseline required controls.
    exception: { allowed: false }

  - id: ASC-GOV-03
    title: Security champion assigned and trained
    domain: GOV
    objective_type: process
    description: The owning team has a named security champion who has completed champion onboarding within 12 months.
    rationale: Champions are the scaling mechanism for threat modelling, triage and guidance.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a } }
    mappings:
      samm: [ { stream: G-EG-B, level: 1 } ]
      ssdf: [ PO.2.1, PO.2.2 ]
      csf: [ PR.AT-02 ]
    assessment:
      mode: automated
      evaluator: champion_assigned@1
      evidence_types: [ registry.application, training.completion ]
      min_confidence: C1
      params: { training_course: champion-onboarding, within_days: 365 }
    proof: Champion field in application.yaml resolved to an active user, and an LMS completion record for the champion course.
    implementation: Nominate a champion; enrol them in the champion programme.
    remediation: Nominate a replacement within 30 days of a champion leaving.

  - id: ASC-GOV-04
    title: Engineers have completed secure development training
    domain: GOV
    objective_type: outcome
    description: At least 90% of engineers contributing to the app's repositories in the last 90 days hold a current secure-development training completion.
    rationale: Baseline awareness reduces the introduction rate of common weakness classes.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: recommended } }
    mappings:
      samm: [ { stream: G-EG-A, level: 1 }, { stream: G-EG-A, level: 2 } ]
      ssdf: [ PO.2.2 ]
      csf: [ PR.AT-01, PR.AT-02 ]
    assessment:
      mode: automated
      evaluator: team_training_coverage@1
      evidence_types: [ training.completion ]
      min_confidence: C3
      params: { threshold_pct: 90, contributor_window_days: 90 }
    proof: >
      LMS completion export (connector) joined to GitHub contributors via the Entra/GitHub identity link. Reported
      at TEAM level only, never per person (privacy, see platform security architecture section 6).
    implementation: Assign the secure-development course to all engineers via the LMS.
    remediation: Team lead schedules outstanding completions.
    notes: LMS connector is PROPOSED; until it exists this control is evaluated from a quarterly HR export (M1).

  - id: ASC-GOV-05
    title: Security contact and vulnerability disclosure route published
    domain: GOV
    objective_type: configuration
    description: The repository contains SECURITY.md (or org default) describing how to report vulnerabilities, and .security/security-contact.yaml names a monitored contact.
    rationale: External and internal reporters need a working route; SSDF RV.1.3.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended } }
    mappings:
      samm: [ { stream: O-IM-B, level: 1 } ]
      ssdf: [ RV.1.3 ]
      csf: [ ID.RA-08 ]
    assessment:
      mode: automated
      evaluator: security_policy_present@1
      evidence_types: [ registry.application ]
      min_confidence: C1
    proof: GitHub API community profile reports a security policy; contact address resolves to a monitored mailbox/group.
    implementation: Inherit the org-level SECURITY.md from the .github repository; add security-contact.yaml.
    remediation: Add the file; re-evaluates on push.

  # ───────────────────────────── REQ: Security requirements ─────────────────────────────

  - id: ASC-REQ-01
    title: ASVS target level and applicability profile defined
    domain: REQ
    objective_type: configuration
    description: >
      .security/asvs.yaml declares the ASVS version and target level (≥ the tier's asvs_target) and the
      applicability profile (web UI, API, OAuth/OIDC, file handling, WebRTC, ...) used to scope requirements.
    rationale: Makes the requirement set explicit and machine-scoped instead of a 300-line checklist.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended } }
    mappings:
      samm: [ { stream: D-SR-A, level: 1 } ]
      asvs: [ V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14, V15, V16, V17 ]
      ssdf: [ PO.1.2, PW.1.2 ]
    assessment:
      mode: automated
      evaluator: asvs_profile_valid@1
      evidence_types: [ registry.application ]
      min_confidence: C1
    proof: Schema validation plus check target_level ≥ classification asvs_target.
    implementation: Generated by onboarding from application.yaml capability flags; team reviews.
    remediation: Raise target level or approve a tier override.
    exception: { allowed: false }

  - id: ASC-REQ-02
    title: Applicable ASVS requirements have a verification status
    domain: REQ
    objective_type: outcome
    description: >
      Every applicable ASVS requirement for the target level has a status of verified (by automated test,
      scanner rule, or manual review evidence), not-verified, or excepted. Target: ≥ 80% verified for Tier 1/2.
    rationale: Turns ASVS into tracked, evidenced requirements rather than a one-off checklist.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a } }
    mappings:
      samm: [ { stream: D-SR-A, level: 2 }, { stream: V-RT-A, level: 1 } ]
      ssdf: [ PW.1.2, PO.4.1 ]
      csf: [ PR.PS-06 ]
    assessment:
      mode: hybrid
      evaluator: asvs_coverage@1
      evidence_types: [ test.security, scan.sast, scan.dast, scan.api, assessment.manual_control ]
      min_confidence: C2
      params: { verified_pct: { 1: 80, 2: 80, 3: 50 } }
    proof: >
      Requirement status is DERIVED from evidence: JUnit tests carrying an asvs property, scanner rules mapped to
      ASVS requirements, and manual review records. A requirement cannot be marked verified by hand.
    implementation: Tag security tests with ASVS IDs; use the test-evidence workflow; book manual review for the rest.
    remediation: Add tests or manual verification for unverified requirements, prioritised by threat model.

  - id: ASC-REQ-03
    title: Supplier and third-party service security requirements recorded
    domain: REQ
    objective_type: process
    description: Third-party services and suppliers listed in application.yaml have a recorded security assessment or contract security schedule reference.
    rationale: SaaS and supplier components are part of the attack surface but invisible to code scanning.
    applicability: { tiers: { 1: mandatory, 2: recommended, 3: n/a, 4: n/a }, conditions: [ has_third_party_services ] }
    mappings:
      samm: [ { stream: D-SR-B, level: 1 }, { stream: D-SR-B, level: 2 } ]
      ssdf: [ PO.1.3 ]
      csf: [ GV.SC-05, GV.SC-07 ]
    assessment:
      mode: manual
      evaluator: manual_attestation@1
      evidence_types: [ assessment.manual_control ]
      min_confidence: M2
    proof: Procurement/supplier-assurance reference recorded per supplier and reviewed by Security Governance.
    implementation: List suppliers in application.yaml; link supplier assurance records.
    remediation: Request supplier assessment through procurement.

  # ───────────────────────────── TM: Threat modelling ─────────────────────────────

  - id: ASC-TM-01
    title: Threat model exists, is structured, and has been reviewed
    domain: TM
    objective_type: process
    description: >
      .security/threat-model/ contains a schema-valid model (system context, data flows, trust boundaries,
      assets, threats with STRIDE category, mitigations, residual risk) and a review is recorded.
    rationale: Design-level threats cannot be found by scanners.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a } }
    mappings:
      samm: [ { stream: D-TA-B, level: 1 }, { stream: D-TA-B, level: 2 } ]
      ssdf: [ PW.1.1 ]
      csf: [ ID.RA-04, ID.RA-05 ]
    assessment:
      mode: hybrid
      evaluator: threat_model_reviewed@1
      evidence_types: [ repo.threat_model, assessment.threat_model ]
      min_confidence: { 1: M2, 2: M2, 3: M1 }
    proof: >
      Structural validity is automated (C1). "Reviewed" requires a review record by a reviewer outside the team
      for Tier 1/2 (M2), bound to the commit SHA of the threat-model files reviewed.
    implementation: Use the threat-model kit (docs/standards/threat-modelling-standard.md); book AppSec facilitation for Tier 1.
    remediation: Complete or update the model; request review in the platform.

  - id: ASC-TM-02
    title: Threat model is current
    domain: TM
    objective_type: process
    description: The reviewed threat model is within its review period and no architecture-change event has occurred since review.
    rationale: Stale threat models give false assurance.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a } }
    mappings:
      samm: [ { stream: D-TA-B, level: 2 }, { stream: D-TA-B, level: 3 } ]
      ssdf: [ PW.1.1 ]
    assessment:
      mode: hybrid
      evaluator: evidence_fresh@1
      evidence_types: [ assessment.threat_model ]
      min_confidence: M1
      params: { architecture_change_signals: [ "PR label: architecture-change", "change to .security/threat-model/data-flow*", "new internet exposure in application.yaml", "new data store in application.yaml" ] }
    proof: Freshness engine; event_bound invalidation from the listed signals.
    implementation: Label architecture-changing PRs; update data-flow on change.
    remediation: Re-review the threat model.

  - id: ASC-TM-03
    title: Threats are mitigated, linked or accepted
    domain: TM
    objective_type: outcome
    description: Every threat rated high in threats.yaml links to a mitigation (control/requirement/ticket) or an approved residual-risk acceptance.
    rationale: A threat model that lists threats but tracks nothing is documentation, not risk management.
    applicability: { tiers: { 1: mandatory, 2: recommended, 3: n/a, 4: n/a } }
    mappings:
      samm: [ { stream: D-TA-B, level: 3 }, { stream: V-AA-B, level: 1 } ]
      ssdf: [ PW.1.2 ]
      csf: [ ID.RA-06 ]
    assessment:
      mode: automated
      evaluator: threat_mitigation_linkage@1
      evidence_types: [ repo.threat_model ]
      min_confidence: C1
    proof: Parser checks every high threat has mitigation refs that resolve (ASVS ID, ASC control, Jira key) or a residual-risk entry with approved exception ID.
    implementation: Reference mitigations by ID in mitigations.yaml.
    remediation: Link or raise mitigation tickets.

  # ───────────────────────────── ARC: Architecture ─────────────────────────────

  - id: ASC-ARC-01
    title: Architecture security review completed
    domain: ARC
    objective_type: process
    description: An architecture security review has been completed before first production release and after every material architecture change.
    rationale: Catches design flaws (authN/authZ model, trust boundaries, data flows) that are expensive to fix later.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a } }
    mappings:
      samm: [ { stream: V-AA-A, level: 1 }, { stream: V-AA-A, level: 2 } ]
      ssdf: [ PW.2.1 ]
      csf: [ ID.RA-05 ]
    assessment:
      mode: manual
      evaluator: manual_attestation@1
      evidence_types: [ assessment.architecture_review ]
      min_confidence: M2
    proof: Review record (reviewer, scope, commit of design docs, outcome, findings imported as findings) in the platform; independent reviewer enforced.
    implementation: Request a review via the platform; provide threat model and architecture docs.
    remediation: Address review findings; request re-review.

  - id: ASC-ARC-02
    title: No end-of-life runtimes or frameworks
    domain: ARC
    objective_type: outcome
    description: No component in the current SBOM or deployed image is a runtime, framework or OS past its end-of-life date.
    rationale: EOL components stop receiving security fixes; vulnerability scanners under-report them.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ has_sbom_capable_stack ] }
    mappings:
      samm: [ { stream: D-SA-B, level: 2 }, { stream: O-EM-B, level: 2 } ]
      ssdf: [ PW.4.1 ]
      csf: [ PR.PS-02 ]
    assessment:
      mode: automated
      evaluator: eol_components@1
      evidence_types: [ sbom, scan.container, sbom.eol ]
      min_confidence: C2
      params: { eol_source: endoflife.date (config/eol-products.yaml), grace_days: 0 }
    proof: SBOM components matched against cached EOL data; result recorded as derived evidence with the data snapshot date.
    implementation: Keep runtimes on supported versions; plan upgrades ahead of EOL (warning at 180 days).
    remediation: Upgrade, or raise a time-bound exception with a migration plan.

  - id: ASC-ARC-03
    title: Architecture review findings tracked to closure
    domain: ARC
    objective_type: outcome
    description: Findings from architecture reviews are recorded as platform findings and remediated within SLA or excepted.
    rationale: Closes the loop between assessment and mitigation.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a } }
    mappings:
      samm: [ { stream: V-AA-B, level: 1 }, { stream: V-AA-B, level: 2 } ]
      ssdf: [ RV.2.2 ]
    assessment:
      mode: automated
      evaluator: findings_within_sla@1
      evidence_types: [ vuln.posture ]
      min_confidence: C3
      params: { source: architecture_review }
    proof: Derived from finding records with source=architecture_review and their SLA state.
    implementation: Reviewer records findings in the platform during review.
    remediation: Remediate or except.

  # ───────────────────────────── SRC: Source & repository protection ─────────────────────────────

  - id: ASC-SRC-01
    title: Default branch protected
    domain: SRC
    objective_type: configuration
    description: >
      Effective rules on the default branch require a pull request, ≥1 approving review (≥2 for Tier 1),
      dismissal of stale approvals, code-owner review, required status checks for the mandatory security
      workflows, and block force-push and deletion. Bypass is limited to a named break-glass team.
    rationale: Guarantees code reaching production was reviewed and passed through the security pipeline.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ has_source_code ] }
    mappings:
      samm: [ { stream: I-SB-A, level: 2 } ]
      ssdf: [ PS.1.1, PW.7.2 ]
      csf: [ PR.PS-01 ]
    assessment:
      mode: automated
      evaluator: branch_protection@1
      evidence_types: [ repo.ruleset ]
      min_confidence: C1
      params: { required_approvals: { 1: 2, 2: 1, 3: 1, 4: 1 }, require_code_owner_review: true, required_checks: [ "aap / sast", "aap / sca", "aap / secrets" ] }
    proof: >
      The effective rules for the branch are read from GitHub's "rules for a branch" API (rulesets and legacy
      protection merged). Configuration IS the operating control here; bypass actor list is also checked.
    implementation: Apply the org ruleset "aap-default-branch" (Terraform-managed via the GitHub provider).
    remediation: Opt the repo into the org ruleset.

  - id: ASC-SRC-02
    title: CODEOWNERS covers security-sensitive paths
    domain: SRC
    objective_type: configuration
    description: A valid CODEOWNERS file exists; .github/workflows/**, .security/** and IaC paths have owners; GitHub reports no CODEOWNERS errors.
    rationale: Ensures workflow and security-contract changes get the right reviewers (prevents silent removal of scans).
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ has_source_code ] }
    mappings:
      samm: [ { stream: I-SB-A, level: 2 } ]
      ssdf: [ PS.1.1 ]
      csf: [ PR.AA-05 ]
    assessment:
      mode: automated
      evaluator: codeowners_coverage@1
      evidence_types: [ repo.codeowners ]
      min_confidence: C1
      params: { required_paths: [ ".github/workflows/", ".security/" ] }
    proof: GitHub CODEOWNERS errors endpoint + platform path-coverage check.
    implementation: Template CODEOWNERS from the repo template.
    remediation: Add owners for uncovered paths.

  - id: ASC-SRC-03
    title: Secret scanning and push protection enabled
    domain: SRC
    objective_type: configuration
    description: GHAS secret scanning, push protection and validity checks are enabled for the repository.
    rationale: Prevents credential leaks at the point of push and detects historic leaks.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory }, conditions: [ has_source_code ] }
    mappings:
      samm: [ { stream: I-SD-B, level: 1 } ]
      ssdf: [ PW.7.2, PS.1.1 ]
      csf: [ PR.DS-01 ]
    assessment:
      mode: automated
      evaluator: security_feature_enabled@1
      evidence_types: [ repo.security_settings ]
      min_confidence: C1
      params: { features: [ secret_scanning, secret_scanning_push_protection, secret_scanning_validity_checks ] }
    proof: security_and_analysis settings from the repos API; push-protection bypasses are separately ingested as findings.
    implementation: Enforced by org security configuration.
    remediation: Enable via the org security configuration.

  - id: ASC-SRC-04
    title: No active exposed secrets
    domain: SRC
    objective_type: outcome
    description: No open secret-scanning alert for a secret that is (or may be) valid; every alert revoked and closed within P1 SLA.
    rationale: An exposed valid credential is the most directly exploitable finding class.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory }, conditions: [ has_source_code ] }
    mappings:
      samm: [ { stream: I-SD-B, level: 2 } ]
      ssdf: [ RV.2.2 ]
      csf: [ ID.RA-06 ]
    assessment:
      mode: automated
      evaluator: no_open_findings@1
      evidence_types: [ scan.secrets ]
      min_confidence: C3
      params: { finding_type: secret, validity: [ active, unknown ] }
    proof: Pulled directly from the secret-scanning alerts API (C3 — authoritative source). Secret values are never stored.
    implementation: Rotate first, then close the alert as revoked.
    remediation: Revoke/rotate the credential; close alert as "revoked".
    exception: { allowed: false }

  - id: ASC-SRC-05
    title: Repository access is least-privilege and visibility is approved
    domain: SRC
    objective_type: configuration
    description: No outside collaborators with write/admin; admin limited to ≤ 3 users or a team; public visibility only with an approved open-source record.
    rationale: Limits who can disable controls or exfiltrate code; prevents accidental publication.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended } }
    mappings:
      samm: [ { stream: I-SB-A, level: 1 } ]
      ssdf: [ PS.1.1 ]
      csf: [ PR.AA-05 ]
    assessment:
      mode: automated
      evaluator: repo_access_policy@1
      evidence_types: [ repo.access ]
      min_confidence: C1
      params: { max_admin_users: 3, public_requires: open_source_approval_id }
    proof: Collaborator/team permissions API, visibility; public repos cross-checked against open-source approval records.
    implementation: Manage access through GitHub teams synced from Entra.
    remediation: Remove direct admin grants; request open-source approval or make private.

  - id: ASC-SRC-06
    title: GitHub Actions workflows are hardened
    domain: SRC
    objective_type: outcome
    description: >
      Workflow static analysis reports no high-severity issues: third-party actions pinned to full SHA,
      no pull_request_target that checks out untrusted code, top-level permissions declared and minimal,
      no script injection from untrusted context, no long-lived cloud credentials.
    rationale: CI is a privileged supply-chain entry point (cf. trivy-action tag compromise, Mar 2026).
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ has_workflows ] }
    mappings:
      samm: [ { stream: I-SB-A, level: 2 }, { stream: I-SB-B, level: 2 } ]
      ssdf: [ PO.3.2, PO.5.1 ]
      csf: [ GV.SC-04, PR.PS-01 ]
    assessment:
      mode: automated
      evaluator: scan_clean@1
      evidence_types: [ scan.workflow_hardening, repo.actions_policy ]
      min_confidence: C2
      params: { max_severity: medium }
    proof: workflow-lint reusable workflow output (attested) on default branch + org Actions policy settings.
    implementation: Use the org's allowed-actions list; pin by SHA (Dependabot keeps pins current).
    remediation: Apply linter fixes; pin actions.

  # ───────────────────────────── BLD: Build & build-time verification ─────────────────────────────

  - id: ASC-BLD-01
    title: SAST executes on every change to the default branch
    domain: BLD
    objective_type: activity
    description: >
      Static analysis (CodeQL via GHAS by default, or an approved alternative) runs on every push to the
      default branch and on PRs, covering every language detected in the repository, with the approved
      query suite.
    rationale: Finds common code-level weakness classes (injection, XSS, unsafe deserialisation) early and cheaply.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ has_source_code ] }
    mappings:
      samm: [ { stream: V-ST-A, level: 1 }, { stream: I-SB-A, level: 2 } ]
      asvs: [ V1, V2, V15 ]
      ssdf: [ PW.7.2 ]
      csf: [ PR.PS-06 ]
    assessment:
      mode: automated
      evaluator: scan_executed@1
      evidence_types: [ scan.sast ]
      min_confidence: C2
      params: { language_coverage: all_detected, query_suite: { 1: security-extended, 2: security-extended, 3: default, 4: default } }
    proof: >
      Evidence of an analysis on the current default-branch HEAD (or a commit within the freshness window whose
      diff to HEAD touches no source paths) from an approved workflow or the GHAS code-scanning analyses API,
      including tool version, languages and query suite. A workflow file alone is C1 and does NOT satisfy this.
    implementation: Call security-workflows/sast or enable CodeQL default setup; both produce acceptable evidence.
    remediation: Fix failing analysis; add missing languages.

  - id: ASC-BLD-02
    title: Dependency vulnerability analysis (SCA) executes
    domain: BLD
    objective_type: activity
    description: Resolved dependencies for all detected ecosystems are analysed for known vulnerabilities on each change to dependency manifests/lockfiles and at least every 30 days.
    rationale: Most exploitable vulnerabilities in modern apps are in third-party components.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory }, conditions: [ uses_dependencies ] }
    mappings:
      samm: [ { stream: I-SB-B, level: 2 } ]
      ssdf: [ PW.4.4, RV.1.1 ]
      csf: [ ID.RA-01 ]
    assessment:
      mode: automated
      evaluator: scan_executed@1
      evidence_types: [ scan.sca ]
      min_confidence: C2
      params: { ecosystem_coverage: all_detected, require_lockfiles: true }
    proof: SCA evidence (approved workflow or Dependabot alerts API) for the current lockfile set; ecosystems compared to repository language/ecosystem detection.
    implementation: Commit lockfiles; call security-workflows/sca.
    remediation: Add lockfiles for unresolved ecosystems.

  - id: ASC-BLD-03
    title: SBOM generated for every release artifact and ingested
    domain: BLD
    objective_type: activity
    description: A CycloneDX SBOM (SPDX accepted and converted) is generated for each built artifact (source SBOM for repos without artifacts), bound to the artifact digest or commit, and ingested into Dependency-Track.
    rationale: Enables "which apps are affected by CVE-X" and continuous monitoring without re-scanning.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ uses_dependencies ] }
    mappings:
      samm: [ { stream: I-SB-B, level: 1 } ]
      ssdf: [ PS.3.2 ]
      csf: [ ID.AM-02 ]
      other: [ "NTIA minimum elements", "CycloneDX 1.5+" ]
    assessment:
      mode: automated
      evaluator: sbom_current@1
      evidence_types: [ sbom ]
      min_confidence: C2
      params: { min_components: 1, require_purl_pct: 95, bind_to: [ artifact_digest, commit ] }
    proof: SBOM evidence with digest binding; ingestion confirmation from Dependency-Track (project UUID, processed timestamp); quality check (purl coverage, component count sanity).
    implementation: Call security-workflows/sbom in the build job that produces the artifact.
    remediation: Fix generator coverage (lockfiles, build context).

  - id: ASC-BLD-04
    title: IaC is scanned for misconfiguration
    domain: BLD
    objective_type: activity
    description: Terraform/Bicep/Kubernetes/Dockerfile content is scanned on each relevant change with the approved policy set.
    rationale: Cloud misconfiguration is a leading cause of breaches and is cheapest to fix pre-deployment.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ has_iac ] }
    mappings:
      samm: [ { stream: O-EM-A, level: 2 }, { stream: I-SB-A, level: 2 } ]
      asvs: [ V13 ]
      ssdf: [ PW.7.2, PW.9.1 ]
      csf: [ PR.PS-01 ]
    assessment:
      mode: automated
      evaluator: scan_executed@1
      evidence_types: [ scan.iac ]
      min_confidence: C2
    proof: Attested IaC scan output on the commit, with policy-set version.
    implementation: Call security-workflows/iac (Checkov + Trivy config; PSRule for Bicep optional).
    remediation: Fix misconfigurations or record skip with justification (tracked as suppression).

  - id: ASC-BLD-05
    title: Container images are scanned by digest
    domain: BLD
    objective_type: activity
    description: Every image built or deployed for the application is scanned (vulnerabilities + misconfig) by digest at build, and re-evaluated continuously via its SBOM.
    rationale: Base-image and OS-package vulnerabilities are invisible to source SCA.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ builds_or_deploys_containers ] }
    mappings:
      samm: [ { stream: I-SB-B, level: 2 }, { stream: O-EM-B, level: 2 } ]
      ssdf: [ PW.4.4, RV.1.1 ]
      csf: [ ID.RA-01 ]
    assessment:
      mode: automated
      evaluator: artifact_scanned@1
      evidence_types: [ scan.container, sbom ]
      min_confidence: C2
      params: { scope: deployed_digests_or_latest_build }
    proof: For each digest in deploy.record (or latest build), a scan evidence record with the same digest exists within freshness.
    implementation: Call security-workflows/container after image build; also generate image SBOM.
    remediation: Rebuild on a patched base image.

  - id: ASC-BLD-06
    title: Release artifacts carry verified build provenance
    domain: BLD
    objective_type: activity
    description: Release artifacts (images, packages) have a SLSA build provenance attestation produced by an approved builder, verifiable via the GitHub attestations API / Sigstore.
    rationale: Proves artifacts were built from the stated source by the stated pipeline; defeats artifact substitution.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ publishes_artifacts ] }
    mappings:
      samm: [ { stream: I-SB-A, level: 3 } ]
      ssdf: [ PS.2.1, PS.3.1 ]
      csf: [ GV.SC-04 ]
      other: [ "SLSA Build L2 (L3 with ephemeral, isolated builders)" ]
    assessment:
      mode: automated
      evaluator: provenance_verified@1
      evidence_types: [ provenance.attestation ]
      min_confidence: C3
    proof: Platform verifies attestation signature, subject digest, and builder identity (approved reusable workflow).
    implementation: Use actions/attest-build-provenance in the build job (via security-workflows/provenance).
    remediation: Add attestation step; rebuild.

  - id: ASC-BLD-07
    title: Dependency review gates new vulnerable or disallowed dependencies
    domain: BLD
    objective_type: configuration
    description: PRs that introduce dependencies with critical/high known vulnerabilities, malicious-package advisories or denied licences fail a required check.
    rationale: Prevents new risk entering, rather than only detecting existing risk.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ uses_dependencies ] }
    mappings:
      samm: [ { stream: I-SB-B, level: 3 } ]
      ssdf: [ PW.4.1 ]
      csf: [ GV.SC-04 ]
    assessment:
      mode: automated
      evaluator: required_check_configured_and_executing@1
      evidence_types: [ repo.ruleset, scan.sca ]
      min_confidence: C2
      params: { check_name: "aap / dependency-review", min_executions_30d: 1 }
    proof: The check is required in effective branch rules (C1) AND has executed on at least one PR in 30 days (C2) — configured-but-never-run does not pass.
    implementation: Call security-workflows/dependency-review on pull_request; add to required checks.
    remediation: Enable the required check.

  - id: ASC-BLD-08
    title: Licence policy compliance
    domain: BLD
    objective_type: outcome
    description: No component in the current SBOM has a licence on the organisation's deny list without an approved exception; unknown licences ≤ 5% of components.
    rationale: Legal and open-source governance risk (ADR-029).
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ uses_dependencies ] }
    mappings:
      samm: [ { stream: I-SB-B, level: 2 }, { stream: G-PC-B, level: 2 } ]
      ssdf: [ PW.4.1 ]
      csf: [ GV.SC-05 ]
    assessment:
      mode: automated
      evaluator: licence_policy@1
      evidence_types: [ scan.licence ]
      min_confidence: C2
      params: { policy: config/licence-policy.yaml, max_unknown_pct: 5 }
    proof: Platform evaluates SBOM licences against a versioned policy; result is derived evidence.
    implementation: Choose dependencies with approved licences; request OSS approval otherwise.
    remediation: Replace component or obtain legal approval (exception).
    owner: oss-governance

  - id: ASC-BLD-09
    title: No malicious or compromised packages
    domain: BLD
    objective_type: outcome
    description: The resolved dependency set contains no package version listed in malicious-package advisories (OSV MAL-*, GHSA malware).
    rationale: Typosquats and hijacked packages execute at install/build time — before any other control.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory }, conditions: [ uses_dependencies ] }
    mappings:
      samm: [ { stream: I-SB-B, level: 3 } ]
      ssdf: [ PW.4.4 ]
      csf: [ GV.SC-04, ID.RA-09 ]
    assessment:
      mode: automated
      evaluator: no_open_findings@1
      evidence_types: [ scan.malicious_package, sbom ]
      min_confidence: C2
      params: { finding_type: malicious_package }
    proof: OSV-based check in SCA workflow + platform re-matching of SBOM inventory against newly published MAL advisories (continuous).
    implementation: Default in security-workflows/sca.
    remediation: Remove the package, rotate any secrets exposed to the build, treat as incident (SOC escalation).
    exception: { allowed: false }

  # ───────────────────────────── DEP: Deployment ─────────────────────────────

  - id: ASC-DEP-01
    title: Production deployments only through protected pipeline environments
    domain: DEP
    objective_type: configuration
    description: Production deployment uses a GitHub environment with required reviewers (Tier 1/2), restricted deployment branches, and environment-scoped secrets/OIDC; deployments are recorded.
    rationale: Ensures what runs in production came through the controlled path.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ deployed_via_github ] }
    mappings:
      samm: [ { stream: I-SD-A, level: 1 }, { stream: I-SD-A, level: 2 } ]
      ssdf: [ PO.5.1 ]
      csf: [ PR.PS-01 ]
    assessment:
      mode: automated
      evaluator: environment_protection@1
      evidence_types: [ repo.environments, deploy.record ]
      min_confidence: C1
      params: { production_env_pattern: "^(prod|production)", required_reviewers: { 1: 1, 2: 1 } }
    proof: Environments API (protection rules, branch policies) + deployments API showing production deployments originate from those environments.
    implementation: Define a production environment; deploy only from it.
    remediation: Add protection rules.

  - id: ASC-DEP-02
    title: No long-lived cloud credentials in CI
    domain: DEP
    objective_type: configuration
    description: CI authenticates to Azure/AWS via OIDC federation; no repository/environment secrets hold cloud client secrets or access keys.
    rationale: Long-lived CI credentials are a top supply-chain exfiltration target.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: recommended }, conditions: [ has_cloud_scope ] }
    mappings:
      samm: [ { stream: I-SD-B, level: 2 } ]
      ssdf: [ PO.5.1 ]
      csf: [ PR.AA-01 ]
    assessment:
      mode: automated
      evaluator: no_static_cloud_credentials@1
      evidence_types: [ repo.environments, scan.workflow_hardening ]
      min_confidence: C1
      params: { secret_name_patterns: [ "(?i)AZURE_CLIENT_SECRET", "(?i)AWS_SECRET_ACCESS_KEY", "(?i)AZURE_CREDENTIALS" ] }
    proof: Secret NAMES (never values) from repo/environment secrets API + workflow analysis for credential-based login actions.
    implementation: Use OIDC federation from the pipeline to the cloud; never stored cloud keys.
    remediation: Migrate to OIDC; delete the secret; rotate the old credential.

  - id: ASC-DEP-03
    title: Artifact integrity verified at deployment
    domain: DEP
    objective_type: activity
    description: The deployment pipeline verifies the provenance attestation of the artifact digest before deploying (or the platform enforces via admission policy).
    rationale: Closes the gap between "built securely" and "what is running".
    applicability: { tiers: { 1: mandatory, 2: recommended, 3: n/a, 4: n/a }, conditions: [ publishes_artifacts ] }
    mappings:
      samm: [ { stream: I-SD-A, level: 3 } ]
      ssdf: [ PS.2.1 ]
      other: [ "SLSA verification" ]
    assessment:
      mode: automated
      evaluator: deploy_verification_executed@1
      evidence_types: [ deploy.record ]
      min_confidence: C2
    proof: deploy-evidence workflow records `gh attestation verify` outcome against the deployed digest.
    implementation: Use security-workflows/deploy-evidence in CD before the deploy step.
    remediation: Add verification step.

  - id: ASC-DEP-04
    title: Application runtime secrets held in a managed vault
    domain: DEP
    objective_type: configuration
    description: Runtime secrets are referenced from Key Vault / AWS Secrets Manager via managed identity, not set as plain app settings or env vars in IaC.
    rationale: Centralised rotation, audit and access control for secrets.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ has_cloud_scope ] }
    mappings:
      samm: [ { stream: I-SD-B, level: 2 }, { stream: I-SD-B, level: 3 } ]
      asvs: [ V13 ]
      ssdf: [ PO.5.1 ]
      csf: [ PR.DS-01 ]
    assessment:
      mode: hybrid
      evaluator: scan_clean@1
      evidence_types: [ scan.iac, cloud.posture ]
      min_confidence: C2
      params: { policy_ids: [ "secrets-in-app-settings", "kv-reference-required" ] }
    proof: IaC policy checks for plaintext secret settings + Defender recommendations on the app's cloud scope.
    implementation: Use Key Vault references / Secrets Manager with managed identity.
    remediation: Move secrets to vault; rotate.

  # ───────────────────────────── TST: Verification testing ─────────────────────────────

  - id: ASC-TST-01
    title: DAST executes against a deployed environment
    domain: TST
    objective_type: activity
    description: A dynamic scan runs against a deployed non-production environment after each release (and at least every 90 days), authenticated for Tier 1/2.
    rationale: Finds runtime issues (headers, session handling, injection reachable at runtime) that SAST cannot.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ has_web_ui_or_api, deployed ] }
    mappings:
      samm: [ { stream: V-ST-A, level: 2 } ]
      asvs: [ V3, V7, V12, V13 ]
      ssdf: [ PW.8.2 ]
      csf: [ PR.PS-06 ]
    assessment:
      mode: automated
      evaluator: dast_executed@1
      evidence_types: [ scan.dast, deploy.record ]
      min_confidence: C2
      params: { authenticated: { 1: true, 2: true, 3: false }, min_urls_crawled: 10 }
    proof: Attested DAST output naming the target URL, auth context and policy, linked to the release (deploy.record) it tested; a scan that crawled < min_urls is recorded as INCONCLUSIVE, not passing.
    implementation: Call security-workflows/dast (OWASP ZAP baseline/full) post-deploy to test env.
    remediation: Fix findings; fix auth configuration if the scan is inconclusive.

  - id: ASC-TST-02
    title: API security testing against the API definition
    domain: TST
    objective_type: activity
    description: APIs with an OpenAPI definition are tested for OWASP API Top 10 classes (authZ/BOLA, mass assignment, rate limiting) using the definition.
    rationale: APIs are the dominant attack surface; generic DAST under-tests them.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ has_api ] }
    mappings:
      samm: [ { stream: V-ST-A, level: 2 }, { stream: V-RT-B, level: 2 } ]
      asvs: [ V4, V8, V9, V10 ]
      ssdf: [ PW.8.2 ]
      other: [ "OWASP API Security Top 10" ]
    assessment:
      mode: automated
      evaluator: scan_executed@1
      evidence_types: [ scan.api ]
      min_confidence: C2
    proof: Attested API scan evidence bound to the OpenAPI document digest and deployed release.
    implementation: Publish OpenAPI in-repo; call security-workflows/api.
    remediation: Fix findings; add authZ test cases.

  - id: ASC-TST-03
    title: Independent penetration test within period
    domain: TST
    objective_type: process
    description: Tier 1 apps have a penetration test annually and after major change; Tier 2 biennially; findings imported.
    rationale: Expert testing finds business-logic and chained issues tools miss.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ deployed ] }
    mappings:
      samm: [ { stream: V-ST-B, level: 2 } ]
      ssdf: [ PW.8.2 ]
      csf: [ ID.RA-01 ]
    assessment:
      mode: manual
      evaluator: manual_attestation@1
      evidence_types: [ assessment.pentest ]
      min_confidence: M2
      params: { valid_days: { 1: 365, 2: 730 } }
    proof: Pen-test record (tester org, scope, dates, report SHA-256 in WORM store, findings imported with source=pentest) recorded by AppSec.
    implementation: Book via AppSec; provide test environment and accounts.
    remediation: Remediate findings within SLA; retest.

  - id: ASC-TST-04
    title: Abuse-case tests derived from the threat model
    domain: TST
    objective_type: activity
    description: High-rated threats from the threat model have corresponding automated negative/abuse-case tests that run in CI.
    rationale: Converts design threats into regression-protected tests.
    applicability: { tiers: { 1: mandatory, 2: recommended, 3: n/a, 4: n/a } }
    mappings:
      samm: [ { stream: V-RT-B, level: 2 }, { stream: V-RT-A, level: 3 } ]
      ssdf: [ PW.8.2 ]
    assessment:
      mode: automated
      evaluator: threat_test_linkage@1
      evidence_types: [ test.security, repo.threat_model ]
      min_confidence: C2
      params: { min_pct_high_threats_tested: 60 }
    proof: JUnit test properties reference threat IDs from threats.yaml; executed and passing on default branch.
    implementation: "Tag tests with a `threat` property (e.g. TM-07); use security-workflows/test-evidence."
    remediation: Add tests for untested high threats.

  - id: ASC-TST-05
    title: Security regression tests run in CI
    domain: TST
    objective_type: activity
    description: Automated security tests (authN/authZ, input validation, headers) tagged with ASVS IDs run on every change and pass.
    rationale: Requirements-driven verification that scales.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ has_source_code ] }
    mappings:
      samm: [ { stream: V-RT-A, level: 2 }, { stream: V-RT-A, level: 3 } ]
      asvs: [ V6, V7, V8 ]
      ssdf: [ PW.8.2 ]
    assessment:
      mode: automated
      evaluator: tests_executed@1
      evidence_types: [ test.security ]
      min_confidence: C2
      params: { min_tests: 5 }
    proof: test-evidence workflow extracts JUnit testcases with asvs properties; pass/fail per requirement.
    implementation: See ASVS implementation guide.
    remediation: Add or fix tests.

  # ───────────────────────────── VUL: Defect & vulnerability management ─────────────────────────────

  - id: ASC-VUL-01
    title: Findings are owned and triaged within SLA
    domain: VUL
    objective_type: outcome
    description: Every open finding maps to an application and owner, and P1–P3 findings are triaged (ticketed, false-positive, or excepted) within the triage SLA.
    rationale: Untriaged findings are invisible risk.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory } }
    mappings:
      samm: [ { stream: I-DM-A, level: 1 }, { stream: I-DM-A, level: 2 } ]
      ssdf: [ RV.2.1 ]
      csf: [ ID.RA-01, ID.RA-06 ]
    assessment:
      mode: automated
      evaluator: triage_within_sla@1
      evidence_types: [ vuln.posture ]
      min_confidence: C3
      params: { max_breaches: 0 }
    proof: Derived from finding state history and the risk model's triage SLA.
    implementation: Champion triages from the platform/Jira queue.
    remediation: Triage overdue findings.

  - id: ASC-VUL-02
    title: Vulnerabilities remediated within SLA
    domain: VUL
    objective_type: outcome
    description: No P1 or P2 finding past remediation SLA; ≥ 90% of P3 within SLA over trailing 90 days. Remediation is verified by re-scan, not by ticket closure.
    rationale: Measures what matters — risk reduction speed — without rewarding low detection.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory } }
    mappings:
      samm: [ { stream: I-DM-A, level: 2 }, { stream: I-DM-A, level: 3 } ]
      ssdf: [ RV.2.2 ]
      csf: [ ID.RA-06 ]
    assessment:
      mode: automated
      evaluator: findings_within_sla@1
      evidence_types: [ vuln.posture ]
      min_confidence: C3
      params: { max_overdue: { P1: 0, P2: 0 }, p3_within_sla_pct: 90 }
    proof: Finding projection with SLA clock (from risk model version in force at detection); closure requires verification evidence.
    implementation: Prioritise by platform priority; use exceptions when a fix is genuinely blocked.
    remediation: Fix or raise an exception.

  - id: ASC-VUL-03
    title: Exceptions are approved, current and within limits
    domain: VUL
    objective_type: outcome
    description: All exceptions for the app are approved by the correct approver, within max duration, and not expired; renewals ≤ 2.
    rationale: Exceptions are legitimate risk decisions only if governed.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory } }
    mappings:
      samm: [ { stream: G-PC-B, level: 2 }, { stream: I-DM-A, level: 2 } ]
      csf: [ ID.RA-07, GV.RM-04 ]
    assessment:
      mode: automated
      evaluator: exceptions_governed@1
      evidence_types: [ vuln.posture ]
      min_confidence: C3
      params: { max_renewals: 2 }
    proof: Exception records and their approval audit trail; expiry generates a finding automatically (ADR-021).
    implementation: Use the platform exception workflow; never suppress in tools as a substitute.
    remediation: Remediate, or renew with fresh approval.
    exception: { allowed: false }

  - id: ASC-VUL-04
    title: Recurring weakness classes are analysed
    domain: VUL
    objective_type: process
    description: Quarterly, the team reviews its top recurring CWE classes (computed by the platform) and records a root-cause action.
    rationale: Moves from fixing instances to eliminating classes.
    applicability: { tiers: { 1: mandatory, 2: recommended, 3: n/a, 4: n/a } }
    mappings:
      samm: [ { stream: I-DM-B, level: 2 }, { stream: I-DM-B, level: 3 } ]
      ssdf: [ RV.3.1, RV.3.2, RV.3.3 ]
      csf: [ ID.IM-02 ]
    assessment:
      mode: hybrid
      evaluator: periodic_process@1
      evidence_types: [ process.review_record ]
      min_confidence: M1
    proof: Platform pre-generates the recurring-CWE report; the review record (attendees, decisions, linked tickets) is submitted within 120 days of the last.
    implementation: Run in the team's retrospective with the champion.
    remediation: Hold the review.

  # ───────────────────────────── OPS: Operations ─────────────────────────────

  - id: ASC-OPS-01
    title: Security-relevant application logs reach the SIEM
    domain: OPS
    objective_type: activity
    description: Authentication, authorisation failures, admin actions and security exceptions are logged and delivered to Sentinel (or Exabeam) with the application identifier; the log source is healthy.
    rationale: Detection and incident response depend on it.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ deployed ] }
    mappings:
      samm: [ { stream: O-IM-A, level: 1 }, { stream: O-IM-A, level: 2 } ]
      asvs: [ V16 ]
      csf: [ PR.PS-04, DE.CM-09 ]
    assessment:
      mode: automated
      evaluator: log_source_healthy@1
      evidence_types: [ siem.log_source_health ]
      min_confidence: C3
      params: { window_hours: 24, required_event_categories: [ authentication ] }
    proof: Scheduled KQL query via the Log Analytics query API returns events for the app's tag in the window. Reader role created by `modules/sentinel`; the app tagging convention is a project task.
    implementation: Use the logging standard; tag logs with the application ID.
    remediation: Restore the log pipeline.

  - id: ASC-OPS-02
    title: Incident response readiness for the application
    domain: OPS
    objective_type: process
    description: An app-specific incident runbook (contacts, kill switches, credential rotation steps, data-breach decision points) exists and has been exercised or reviewed in 12 months.
    rationale: Reduces time to contain.
    applicability: { tiers: { 1: mandatory, 2: recommended, 3: n/a, 4: n/a }, conditions: [ deployed ] }
    mappings:
      samm: [ { stream: O-IM-B, level: 1 }, { stream: O-IM-B, level: 2 } ]
      csf: [ RS.MA-01 ]
    assessment:
      mode: manual
      evaluator: manual_attestation@1
      evidence_types: [ assessment.manual_control ]
      min_confidence: { 1: M2, 2: M1 }
    proof: Runbook link (version-controlled) + exercise record reviewed by SOC/AppSec.
    implementation: Template in docs/runbooks.
    remediation: Write/exercise the runbook.

  - id: ASC-OPS-03
    title: Cloud posture findings on the application's scopes are within SLA
    domain: OPS
    objective_type: outcome
    description: High/critical Defender for Cloud / Security Hub findings on subscriptions, resource groups or accounts mapped to the app are remediated within SLA.
    rationale: Runtime configuration drift is invisible to repo scanning.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ has_cloud_scope ] }
    mappings:
      samm: [ { stream: O-EM-A, level: 2 }, { stream: O-EM-A, level: 3 } ]
      csf: [ PR.PS-01, ID.RA-01 ]
    assessment:
      mode: automated
      evaluator: findings_within_sla@1
      evidence_types: [ cloud.posture ]
      min_confidence: C3
      params: { source: [ defender, security_hub ] }
    proof: Connector pulls findings scoped by the app's cloud mapping (subscription/RG/tag/account); risk engine assigns SLA.
    implementation: Map cloud scopes in application.yaml; tag resources with app ID.
    remediation: Fix configuration; or except with compensating control.
    owner: cloud-security

  - id: ASC-OPS-04
    title: Deployed images and runtimes are patched regularly
    domain: OPS
    objective_type: outcome
    description: Every deployed image digest was built within the last 30 days (Tier 1/2) or 90 days (Tier 3), or has no fixable high/critical OS-package vulnerabilities.
    rationale: Base-image patches only reach production if images are rebuilt and redeployed.
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: recommended, 4: n/a }, conditions: [ builds_or_deploys_containers, deployed ] }
    mappings:
      samm: [ { stream: O-EM-B, level: 1 }, { stream: O-EM-B, level: 2 } ]
      csf: [ PR.PS-02 ]
    assessment:
      mode: automated
      evaluator: image_patch_age@1
      evidence_types: [ deploy.record, scan.container ]
      min_confidence: C2
      params: { max_age_days: { 1: 30, 2: 30, 3: 90 } }
    proof: deploy.record digests joined to build timestamp (provenance) and container scan results.
    implementation: Scheduled rebuilds; Renovate/Dependabot for base images.
    remediation: Rebuild and redeploy.

  - id: ASC-OPS-05
    title: Data stores are inventoried, encrypted and backed up per classification
    domain: OPS
    objective_type: configuration
    description: Data stores listed in application.yaml match discovered cloud data resources; encryption and backup settings meet the classification baseline.
    rationale: SAMM Data Protection; prevents shadow data stores.
    applicability: { tiers: { 1: mandatory, 2: recommended, 3: n/a, 4: n/a }, conditions: [ has_cloud_scope ] }
    mappings:
      samm: [ { stream: O-OM-A, level: 1 }, { stream: O-OM-A, level: 2 } ]
      asvs: [ V14 ]
      csf: [ ID.AM-07, PR.DS-01 ]
    assessment:
      mode: hybrid
      evaluator: data_store_baseline@1
      evidence_types: [ cloud.posture, registry.application ]
      min_confidence: C1
    proof: Azure Resource Graph / AWS Config resource inventory for mapped scopes compared to declared stores; encryption/backup properties checked.
    implementation: Declare data stores in application.yaml.
    remediation: Declare or remove undeclared stores; enable backups.
    notes: PROPOSED for Phase 8+; depends on reliable cloud-scope mapping.

  - id: ASC-OPS-06
    title: Retired applications are fully decommissioned
    domain: OPS
    objective_type: outcome
    description: Applications with lifecycle_status=retired have repos archived, cloud scopes empty or deleted, secrets revoked, and DNS removed within 90 days.
    rationale: Abandoned assets are a common breach entry point (dangling DNS, forgotten credentials).
    applicability: { tiers: { 1: mandatory, 2: mandatory, 3: mandatory, 4: mandatory }, conditions: [ lifecycle_retired ] }
    mappings:
      samm: [ { stream: O-OM-B, level: 1 }, { stream: O-OM-B, level: 2 } ]
      csf: [ ID.AM-08 ]
    assessment:
      mode: automated
      evaluator: decommission_complete@1
      evidence_types: [ repo.access, cloud.posture ]
      min_confidence: C1
      params: { within_days: 90 }
    proof: Repo archived flag; no resources in mapped scopes; no active secrets in mapped vaults.
    implementation: Follow the decommissioning runbook.
    remediation: Complete outstanding decommission steps.
