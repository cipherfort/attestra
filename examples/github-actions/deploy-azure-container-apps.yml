# EXAMPLE (copy into your own deployment repository): build → scan → attest → push → migrate → deploy to Azure
# Container Apps (examples/terraform/azure). The product's own release is .github/workflows/release.yml (GHCR images
# and the Helm chart); most adopters deploy those published, signed artifacts instead of building.
# Release: build → scan → attest → push → migrate → deploy (docs/architecture/07-platform-cicd.md).
# No stored cloud credentials: Azure login is GitHub OIDC → the deploy managed identity (examples/terraform/azure/modules/
# platform, github_deploy_subjects). Values come from the GitHub environment's VARIABLES (envs/azure output `deploy`).
# Production requires the environment's required reviewers (GitHub environment protection) before this job starts.
name: deploy-azure

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, production]
        default: dev

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write       # Azure OIDC login and the provenance attestation
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: echo "image=${{ vars.ACR }}/aap:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local, for scanning before anything is pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: aap:scan
          provenance: false
      - name: Scan the image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aap:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${ACR%%.*}"
        env:
          ACR: ${{ vars.ACR }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ vars.ACR }}/aap
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ vars.ACR }}/aap@${{ needs.build.outputs.digest }}
      RG: ${{ vars.RESOURCE_GROUP }}
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${ACR%%.*}"
        env:
          ACR: ${{ vars.ACR }}
      - name: Verify the provenance of what we are about to run
        run: gh attestation verify "oci://${IMAGE}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/deploy-azure-container-apps.yml"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Migrate (forward-only), then load the governed configuration
        run: |
          az containerapp job update -g "$RG" -n "${{ vars.MIGRATE_JOB }}" --image "$IMAGE" -o none
          execution=$(az containerapp job start -g "$RG" -n "${{ vars.MIGRATE_JOB }}" --query name -o tsv)
          for _ in $(seq 1 90); do
            status=$(az containerapp job execution show -g "$RG" -n "${{ vars.MIGRATE_JOB }}" --job-execution-name "$execution" --query properties.status -o tsv)
            [ "$status" = "Succeeded" ] && exit 0
            [ "$status" = "Failed" ] && { echo "migration failed"; exit 1; }
            sleep 10
          done
          echo "migration timed out"; exit 1
      - name: Roll out api, hook, worker
        run: |
          for app in ${APPS//,/ }; do
            az containerapp update -g "$RG" -n "$app" --image "$IMAGE" -o none
          done
        env:
          APPS: ${{ vars.APPS }}
