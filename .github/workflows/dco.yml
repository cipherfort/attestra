# Developer Certificate of Origin: every commit in a pull request must carry a Signed-off-by from its author.
name: dco
on:
  pull_request:
permissions: {}
jobs:
  signoff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OPENED_BY: ${{ github.event.pull_request.user.login }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            # Dependabot cannot sign off. Exempt its commits only on pull requests Dependabot itself opened, so a
            # human cannot skip the check by borrowing the bot's author name.
            if [ "$OPENED_BY" = "dependabot[bot]" ] && [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              continue
            fi
            # The same for release-please's generated release commit (version bump and changelog): its pull request
            # is opened by github-actions[bot], which only a workflow can do.
            if [ "$OPENED_BY" = "github-actions[bot]" ] && [ "$author" = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" ]; then
              continue
            fi
            if ! git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit $c is not signed off by its author ($author). Use: git commit -s"
              fail=1
            fi
          done
          exit $fail
