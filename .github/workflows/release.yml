# SPDX-License-Identifier: Apache-2.0
# Product release, on a version tag: multi-arch image → scan → GHCR with SBOM, SLSA provenance and a cosign keyless
# signature; the Helm chart packaged, pushed to GHCR (OCI) and signed; a GitHub release with verification commands.
# Nothing here deploys anywhere: adopters pull the signed artifacts (docs: install) or build from source.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # keyless signing (cosign) and the provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/attestra" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 locally for scanning (nothing is pushed before the scan passes)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: aap:scan
          provenance: false
      - name: Scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aap:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        name: Build and push linux/amd64 + linux/arm64, with an SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
      - name: SLSA build provenance (GitHub attestation, pushed to the registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless cosign signature
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

  chart:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # the GitHub release
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package the chart pinned to the released image digest, push, sign
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          sed -i "s|^version: .*|version: ${version}|; s|^appVersion: .*|appVersion: \"${version}\"|" charts/attestra/Chart.yaml
          sed -i "s|^  digest: .*|  digest: \"${DIGEST}\"|; s|^  repository: .*|  repository: ${IMAGE}|" charts/attestra/values.yaml
          helm package charts/attestra
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          out=$(helm push "attestra-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1)
          echo "$out"
          chart_digest=$(echo "$out" | sed -n 's/^Digest: //p')
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/attestra@${chart_digest}"
      - name: GitHub release with verification instructions
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Image: \`${IMAGE}@${DIGEST}\` (linux/amd64, linux/arm64)

          Verify before you run it:
          \`\`\`bash
          gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          Helm: \`helm install attestra oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/attestra --version ${TAG#v}\` (see docs/install/helm.md).
          NOTES
          gh release create "$TAG" attestra-*.tgz --title "$TAG" --notes-file notes.md --verify-tag
