# Dependency updates. Every update arrives as a pull request and passes the same CI (tests, licence gate, scans).
# A 3-day cooldown avoids adopting a release before the ecosystem has had a chance to flag it (ADR-029).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups: { frontend: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    # Runtime upgrades (Python 3.12 -> 3.13, Node 22 LTS -> the next LTS) are deliberate changes with their own
    # pull request and test run, not a weekly bump. Patch and digest updates still arrive.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: terraform
    directories: [/examples/terraform/aws, /examples/terraform/azure/envs/azure, /examples/terraform/azure/envs/aws,
                  /examples/terraform/azure/envs/github, /examples/terraform/azure/state-bootstrap]
    schedule: { interval: monthly }
