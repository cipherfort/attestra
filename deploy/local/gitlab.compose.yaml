# GitLab CE + a runner, for the GitLab adapter's live tests and the evidence-trust spike (ADR-033). ~4 GB RAM.
#   docker compose -f deploy/local/gitlab.compose.yaml up -d      (first start takes several minutes)
# The root password comes from deploy/local/.env (GITLAB_ROOT_PASSWORD, generated by bootstrap.sh gitlab).
name: aap-gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.0-ce.0
    hostname: gitlab.local.test
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?run deploy/local/bootstrap.sh gitlab first}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.local.test:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        registry['enable'] = false
    ports: ["127.0.0.1:8929:8929"]
    shm_size: 256m
    volumes: [gitlab-config:/etc/gitlab, gitlab-logs:/var/log/gitlab, gitlab-data:/var/opt/gitlab]
  runner:
    image: gitlab/gitlab-runner:v18.5.0
    depends_on: [gitlab]
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock   # docker executor: job containers run on the local Docker
volumes: { gitlab-config: {}, gitlab-logs: {}, gitlab-data: {}, runner-config: {} }
