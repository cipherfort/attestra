# Local integration stack: every external system the platform talks to, started from zero on one machine.
# Nothing here exists until you run it; nothing here is shared with anyone else.
#
#   docker compose -f deploy/local/compose.yaml up -d                      # core: postgres, OIDC, Azurite
#   docker compose -f deploy/local/compose.yaml --profile scanners up -d   # + Dependency-Track + DefectDojo (~5 GB RAM)
#   ./deploy/local/bootstrap.sh                                            # create credentials (see docs/operations/integration-bootstrap.md)
#
# Secrets: generated by deploy/local/.env (created by bootstrap.sh, git-ignored, mode 600). No default passwords are
# used beyond the very first boot of Dependency-Track (admin/admin), which `aap bootstrap dependency-track` changes.
# All ports bind to 127.0.0.1 only.

name: aap-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aap
      POSTGRES_PASSWORD: ${AAP_PG_PASSWORD:?run deploy/local/bootstrap.sh first}
    ports: [ "127.0.0.1:55433:5432" ]
    volumes: [ "aap-pg:/var/lib/postgresql/data" ]
    healthcheck: { test: [ "CMD", "pg_isready", "-U", "postgres" ], interval: 5s, retries: 20 }

  # Stand-in for Entra ID: a standards-compliant OIDC provider. The platform's OIDC code is identical for both;
  # only issuer, client id and client authentication differ (Entra: managed-identity federated credential).
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG_PATH: /config/oidc.json
    volumes: [ "./oidc.json:/config/oidc.json:ro" ]
    ports: [ "127.0.0.1:8090:8090" ]

  # Stand-in for Azure Blob Storage (evidence WORM store). Azurite does not enforce immutability policies: the
  # platform's own write-once checks are exercised; the storage-level policy is tested only in Azure (infra).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: [ "azurite-blob", "--blobHost", "0.0.0.0", "--loose", "--skipApiVersionCheck" ]  # SDK API version is newer than the emulator
    ports: [ "127.0.0.1:10000:10000" ]

  dependency-track:
    profiles: [ scanners ]
    image: dependencytrack/apiserver:4.14.5
    environment:
      EXTRA_JAVA_OPTIONS: "-Xmx2g"
    mem_limit: 3g
    ports: [ "127.0.0.1:8081:8080" ]
    volumes: [ "aap-dt:/data" ]

  dd-postgres:
    profiles: [ scanners ]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DB_PASSWORD:?run deploy/local/bootstrap.sh first}
    volumes: [ "aap-dd-pg:/var/lib/postgresql/data" ]
    healthcheck: { test: [ "CMD", "pg_isready", "-U", "defectdojo" ], interval: 5s, retries: 20 }

  dd-valkey:
    profiles: [ scanners ]
    image: valkey/valkey:8-alpine

  dd-initializer:
    profiles: [ scanners ]
    image: defectdojo/defectdojo-django:3.4.0
    entrypoint: [ "/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-initializer.sh" ]
    depends_on: { dd-postgres: { condition: service_healthy } }
    environment: &dd-env
      DD_DATABASE_URL: postgresql://defectdojo:${DD_DB_PASSWORD}@dd-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://dd-valkey:6379/0
      DD_SECRET_KEY: ${DD_SECRET_KEY:?run deploy/local/bootstrap.sh first}
      DD_CREDENTIAL_AES_256_KEY: ${DD_AES_KEY:?run deploy/local/bootstrap.sh first}
      DD_ALLOWED_HOSTS: "*"
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@localhost
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?run deploy/local/bootstrap.sh first}
      DD_INITIALIZE: "true"
      DD_JIRA_ENABLED: "False"     # ADR-018: the platform is the only ticket writer

  dd-uwsgi:
    profiles: [ scanners ]
    image: defectdojo/defectdojo-django:3.4.0
    entrypoint: [ "/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-uwsgi.sh" ]
    depends_on: { dd-initializer: { condition: service_completed_successfully } }
    environment: *dd-env

  dd-celeryworker:
    profiles: [ scanners ]
    image: defectdojo/defectdojo-django:3.4.0
    entrypoint: [ "/wait-for-it.sh", "dd-postgres:5432", "-t", "60", "--", "/entrypoint-celery-worker.sh" ]
    depends_on: { dd-initializer: { condition: service_completed_successfully } }
    environment: *dd-env

  dd-nginx:
    profiles: [ scanners ]
    image: defectdojo/defectdojo-nginx:3.4.0
    depends_on: [ dd-uwsgi ]
    environment:
      DD_UWSGI_HOST: dd-uwsgi
      DD_UWSGI_PORT: "3031"
      NGINX_METRICS_ENABLED: "false"
    ports: [ "127.0.0.1:8082:8080" ]

volumes:
  aap-pg: {}
  aap-dt: {}
  aap-dd-pg: {}
