# Secrets scanning (gitleaks). Default rules, plus an allowlist for values that are public by design.
[extend]
useDefault = true

[allowlist]
description = "Public, documented values (not secrets)"
regexes = [
  # Azurite (Azure Storage emulator) well-known development account key, identical in every installation:
  # https://learn.microsoft.com/azure/storage/common/storage-use-azurite#well-known-storage-account-and-key
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
]
# Generated local credentials: git-ignored, never committed (deploy/local/bootstrap.sh writes them, mode 600)
paths = ['''deploy/local/\.env$''', '''deploy/local/aap\.env$''']
