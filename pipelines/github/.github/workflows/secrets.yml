# SPDX-License-Identifier: Apache-2.0
# FortProof shipped pipeline: Secrets in the tree (gitleaks).
# Source: pipelines/github/ in the platform repository. Do not edit the copy in your security-workflows repository by
# hand: change the source, re-run `aap pipelines export`, review, release, and approve the new commit SHA
# (`aap pipelines approve`). Evidence from any other commit is rejected (UNAPPROVED_WORKFLOW_REF).
name: aap-secrets

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. GitHub-hosted runners allow C3 evidence; plain self-hosted runners are capped at C2.
        type: string
        default: ubuntu-latest

permissions: {}

jobs:
  secrets:
    name: Secrets in the tree (gitleaks)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write       # keyless signature over the evidence manifest
      attestations: write   # store it (public repos, or GitHub Enterprise Cloud for private ones)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        shell: bash
        run: |
          # --redact: the report never contains the secret itself
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/out" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact --no-banner --exit-code 0 --report-format sarif --report-path /out/gitleaks.sarif
          cp "$RUNNER_TEMP/gitleaks.sarif" gitleaks.sarif
      # @@aap-evidence-tool@@
      - name: Write the evidence manifest
        id: manifest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/aap_evidence.py" manifest --type scan.secrets --tool-name gitleaks --tool-version 8.30.1 --policy-ref gitleaks/default --out "$RUNNER_TEMP/aap-evidence" gitleaks.sarif
          python3 "$RUNNER_TEMP/aap_evidence.py" verify "$RUNNER_TEMP/aap-evidence"
      - name: Sign the manifest
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        continue-on-error: true   # private repos without Enterprise Cloud: no attestation, evidence capped at C2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
          predicate-type: https://fortproof.dev/attestation/evidence/v1
          predicate-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
      - name: Upload the evidence bundle
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aap-evidence-secrets
          path: ${{ runner.temp }}/aap-evidence/
          if-no-files-found: error
          retention-days: 30
