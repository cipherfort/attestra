# SPDX-License-Identifier: Apache-2.0
# Attestra shipped pipeline: Infrastructure as code (Checkov).
# Source: pipelines/github/ in the platform repository. Do not edit the copy in your security-workflows repository by
# hand: change the source, re-run `aap pipelines export`, review, release, and approve the new commit SHA
# (`aap pipelines approve`). Evidence from any other commit is rejected (UNAPPROVED_WORKFLOW_REF).
name: aap-iac

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. GitHub-hosted runners allow C3 evidence; plain self-hosted runners are capped at C2.
        type: string
        default: ubuntu-latest
      iac_paths:
        description: Directory to scan (default the whole repository)
        type: string
        default: "."

permissions: {}

jobs:
  iac:
    name: Infrastructure as code (Checkov)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # keyless signature over the evidence manifest
      attestations: write   # store it (public repos, or GitHub Enterprise Cloud for private ones)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan IaC
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: ${{ inputs.iac_paths }}
          output_format: sarif
          output_file_path: checkov-out
          soft_fail: true
      - name: Collect the report
        shell: bash
        run: |
          if [ -s checkov-out/results_sarif.sarif ]; then cp checkov-out/results_sarif.sarif checkov.sarif
          else
            printf '%s' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"checkov","version":"3"}},"results":[]}]}' > checkov.sarif
            echo "AAP_RESULT=inconclusive" >> "$GITHUB_ENV"
          fi
      # @@aap-evidence-tool@@
      - name: Write the evidence manifest
        id: manifest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/aap_evidence.py" manifest --type scan.iac --tool-name checkov --policy-ref checkov/default --result "${AAP_RESULT:-auto}" --out "$RUNNER_TEMP/aap-evidence" checkov.sarif
          python3 "$RUNNER_TEMP/aap_evidence.py" verify "$RUNNER_TEMP/aap-evidence"
      - name: Sign the manifest
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        continue-on-error: true   # private repos without Enterprise Cloud: no attestation, evidence capped at C2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
          predicate-type: https://cipherfort.github.io/attestra/attestation/evidence/v1
          predicate-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
      - name: Upload the evidence bundle
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aap-evidence-iac
          path: ${{ runner.temp }}/aap-evidence/
          if-no-files-found: error
          retention-days: 30
