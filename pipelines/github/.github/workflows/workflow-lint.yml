# SPDX-License-Identifier: Apache-2.0
# Attestra shipped pipeline: Workflow hardening (zizmor).
# Source: pipelines/github/ in the platform repository. Do not edit the copy in your security-workflows repository by
# hand: change the source, re-run `aap pipelines export`, review, release, and approve the new commit SHA
# (`aap pipelines approve`). Evidence from any other commit is rejected (UNAPPROVED_WORKFLOW_REF).
name: aap-workflow-lint

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. GitHub-hosted runners allow C3 evidence; plain self-hosted runners are capped at C2.
        type: string
        default: ubuntu-latest

permissions: {}

jobs:
  workflow-lint:
    name: Workflow hardening (zizmor)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # keyless signature over the evidence manifest
      attestations: write   # store it (public repos, or GitHub Enterprise Cloud for private ones)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (hash-pinned)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/zizmor.txt" <<'EOF'
          zizmor==1.31.0 \
            --hash=sha256:bb4203c790f8d33e110dbeee2ac6d70911e233b93574ffc770aaa21ecd850302 \
            --hash=sha256:1c23fccbd572474a412ed9d8d19b50a4ccf69785b2d3d3c0c3a341ee11e27e65
          EOF
          python3 -m pip install --quiet --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/zizmor.txt"
      - name: Audit the repository's workflows
        shell: bash
        run: |
          zizmor --offline --format sarif --no-exit-codes . > zizmor.sarif
      # @@aap-evidence-tool@@
      - name: Write the evidence manifest
        id: manifest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/aap_evidence.py" manifest --type scan.workflow_hardening --tool-name zizmor --tool-version 1.31.0 --out "$RUNNER_TEMP/aap-evidence" zizmor.sarif
          python3 "$RUNNER_TEMP/aap_evidence.py" verify "$RUNNER_TEMP/aap-evidence"
      - name: Sign the manifest
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        continue-on-error: true   # private repos without Enterprise Cloud: no attestation, evidence capped at C2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
          predicate-type: https://cipherfort.github.io/attestra/attestation/evidence/v1
          predicate-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
      - name: Upload the evidence bundle
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aap-evidence-workflow-lint
          path: ${{ runner.temp }}/aap-evidence/
          if-no-files-found: error
          retention-days: 30
