# SPDX-License-Identifier: Apache-2.0
# FortProof shipped pipeline: Static analysis (CodeQL).
# Source: pipelines/github/ in the platform repository. Do not edit the copy in your security-workflows repository by
# hand: change the source, re-run `aap pipelines export`, review, release, and approve the new commit SHA
# (`aap pipelines approve`). Evidence from any other commit is rejected (UNAPPROVED_WORKFLOW_REF).
name: aap-sast

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. GitHub-hosted runners allow C3 evidence; plain self-hosted runners are capped at C2.
        type: string
        default: ubuntu-latest
      languages:
        description: "CodeQL languages, comma-separated (default: detected from the repository's languages)"
        type: string
        default: ""

permissions: {}

jobs:
  sast:
    name: Static analysis (CodeQL)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # keyless signature over the evidence manifest
      attestations: write   # store it (public repos, or GitHub Enterprise Cloud for private ones)
      security-events: write  # CodeQL uploads results to the Security tab (needs Code Security on private repos)
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect CodeQL languages
        id: lang
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.languages }}
        run: |
          if [ -n "$WANTED" ]; then echo "list=$WANTED" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/languages" --jq 'keys[]' | python3 -c '
          import sys
          m = {"Java": "java-kotlin", "Kotlin": "java-kotlin", "JavaScript": "javascript-typescript",
               "TypeScript": "javascript-typescript", "Python": "python", "Go": "go", "C#": "csharp",
               "Ruby": "ruby", "Swift": "swift", "C": "c-cpp", "C++": "c-cpp", "Rust": "rust"}
          found = sorted({m[l.strip()] for l in sys.stdin if l.strip() in m})
          print("list=" + ",".join(found))' >> "$GITHUB_OUTPUT"
      - name: No supported language
        if: steps.lang.outputs.list == ''
        shell: bash
        run: |
          mkdir -p sarif && printf '%s' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"CodeQL","semanticVersion":"none"}},"results":[]}]}' > sarif/none.sarif
          echo "::warning::No CodeQL-supported language found; evidence records result 'inconclusive'"
          echo "AAP_RESULT=inconclusive" >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@48870fdd6b42ee6474ec4207209ff87609271a5e # v4.39.0
        if: steps.lang.outputs.list != ''
        with:
          languages: ${{ steps.lang.outputs.list }}
          build-mode: none
          queries: security-extended
      - id: analyze
        uses: github/codeql-action/analyze@48870fdd6b42ee6474ec4207209ff87609271a5e # v4.39.0
        if: steps.lang.outputs.list != ''
        with:
          output: sarif
          category: aap-sast
      # @@aap-evidence-tool@@
      - name: Write the evidence manifest
        id: manifest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/aap_evidence.py" manifest --type scan.sast --tool-name codeql --policy-ref codeql/security-extended --result "${AAP_RESULT:-auto}" --out "$RUNNER_TEMP/aap-evidence" sarif/*.sarif
          python3 "$RUNNER_TEMP/aap_evidence.py" verify "$RUNNER_TEMP/aap-evidence"
      - name: Sign the manifest
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        continue-on-error: true   # private repos without Enterprise Cloud: no attestation, evidence capped at C2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
          predicate-type: https://fortproof.dev/attestation/evidence/v1
          predicate-path: ${{ runner.temp }}/aap-evidence/evidence-manifest.json
      - name: Upload the evidence bundle
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aap-evidence-sast
          path: ${{ runner.temp }}/aap-evidence/
          if-no-files-found: error
          retention-days: 30
