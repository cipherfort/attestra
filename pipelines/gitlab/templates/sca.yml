# SPDX-License-Identifier: Apache-2.0
# FortProof shipped GitLab CI/CD component: dependency vulnerabilities (OSV-Scanner).
# Source: pipelines/gitlab/ in the platform repository; rendered by `aap pipelines export --provider gitlab`.
# The platform accepts this job's evidence only if the merged job equals this file at an approved commit (ADR-033):
# do not override its keys in your .gitlab-ci.yml. Only `stage` may be changed (input).
spec:
  inputs:
    stage:
      default: test
---
aap-sca:
  stage: $[[ inputs.stage ]]
  image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
  inherit:
    default: false
    variables: false
  script:
    - wget -q -O /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64"
    - echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner" | sha256sum -c -
    - chmod +x /tmp/osv-scanner && mkdir -p results
    - /tmp/osv-scanner scan --format sarif --output results/osv.sarif --recursive . || test -s results/osv.sarif
    # @@aap-evidence-tool@@
    - >-
      env -i PATH=/usr/local/bin:/usr/bin:/bin
      GITLAB_CI="$GITLAB_CI" CI_PROJECT_PATH="$CI_PROJECT_PATH" CI_PROJECT_ID="$CI_PROJECT_ID"
      CI_COMMIT_SHA="$CI_COMMIT_SHA" CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME" CI_JOB_ID="$CI_JOB_ID"
      CI_PIPELINE_ID="$CI_PIPELINE_ID" CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE"
      CI_PROJECT_VISIBILITY="$CI_PROJECT_VISIBILITY" CI_MERGE_REQUEST_IID="$CI_MERGE_REQUEST_IID"
      CI_CONFIG_PATH="$CI_CONFIG_PATH"
      python3 -I /tmp/aap_evidence.py manifest --type scan.sca --tool-name osv-scanner --tool-version 2.7.0 --result auto --out aap-evidence-sca results/osv.sarif
    - python3 -I /tmp/aap_evidence.py verify aap-evidence-sca
  artifacts:
    when: always
    expire_in: 30 days
    paths: [aap-evidence-sca/]
