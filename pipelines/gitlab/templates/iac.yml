# SPDX-License-Identifier: Apache-2.0
# FortProof shipped GitLab CI/CD component: infrastructure as code (Checkov).
# Source: pipelines/gitlab/ in the platform repository; rendered by `aap pipelines export --provider gitlab`.
# The platform accepts this job's evidence only if the merged job equals this file at an approved commit (ADR-033):
# do not override its keys in your .gitlab-ci.yml. Only `stage` may be changed (input).
spec:
  inputs:
    stage:
      default: test
---
aap-iac:
  stage: $[[ inputs.stage ]]
  image:
    name: bridgecrew/checkov:3.3.29@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3
    entrypoint: [""]   # the image's entrypoint is checkov itself; the runner needs a shell
  inherit:
    default: false
    variables: false
  script:
    - mkdir -p results
    - checkov --directory . --output sarif --output-file-path results --soft-fail --quiet
    - mv results/results_sarif.sarif results/checkov.sarif
    # @@aap-evidence-tool@@
    - >-
      env -i PATH=/usr/local/bin:/usr/bin:/bin
      GITLAB_CI="$GITLAB_CI" CI_PROJECT_PATH="$CI_PROJECT_PATH" CI_PROJECT_ID="$CI_PROJECT_ID"
      CI_COMMIT_SHA="$CI_COMMIT_SHA" CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME" CI_JOB_ID="$CI_JOB_ID"
      CI_PIPELINE_ID="$CI_PIPELINE_ID" CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE"
      CI_PROJECT_VISIBILITY="$CI_PROJECT_VISIBILITY" CI_MERGE_REQUEST_IID="$CI_MERGE_REQUEST_IID"
      CI_CONFIG_PATH="$CI_CONFIG_PATH"
      python3 -I /tmp/aap_evidence.py manifest --type scan.iac --tool-name checkov --tool-version 3.3.29 --policy-ref checkov/default --result auto --out aap-evidence-iac results/checkov.sarif
    - python3 -I /tmp/aap_evidence.py verify aap-evidence-iac
  artifacts:
    when: always
    expire_in: 30 days
    paths: [aap-evidence-iac/]
