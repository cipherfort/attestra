# SPDX-License-Identifier: Apache-2.0
# Attestra shipped GitLab CI/CD component: software bill of materials (Syft).
# Source: pipelines/gitlab/ in the platform repository; rendered by `aap pipelines export --provider gitlab`.
# The platform accepts this job's evidence only if the merged job equals this file at an approved commit (ADR-033):
# do not override its keys in your .gitlab-ci.yml. Only `stage` may be changed (input).
spec:
  inputs:
    stage:
      default: test
---
aap-sbom:
  stage: $[[ inputs.stage ]]
  image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
  inherit:
    default: false
    variables: false
  script:
    - wget -q -O /tmp/syft.tgz "https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz"
    - echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  /tmp/syft.tgz" | sha256sum -c -
    - tar -xzf /tmp/syft.tgz -C /tmp syft && mkdir -p results
    - /tmp/syft scan dir:. -o cyclonedx-json=results/sbom.cdx.json
    # @@aap-evidence-tool@@
    - >-
      env -i PATH=/usr/local/bin:/usr/bin:/bin
      GITLAB_CI="$GITLAB_CI" CI_PROJECT_PATH="$CI_PROJECT_PATH" CI_PROJECT_ID="$CI_PROJECT_ID"
      CI_COMMIT_SHA="$CI_COMMIT_SHA" CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME" CI_JOB_ID="$CI_JOB_ID"
      CI_PIPELINE_ID="$CI_PIPELINE_ID" CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE"
      CI_PROJECT_VISIBILITY="$CI_PROJECT_VISIBILITY" CI_MERGE_REQUEST_IID="$CI_MERGE_REQUEST_IID"
      CI_CONFIG_PATH="$CI_CONFIG_PATH"
      python3 -I /tmp/aap_evidence.py manifest --type sbom --tool-name syft --tool-version 1.54.1 --result pass --out aap-evidence-sbom results/sbom.cdx.json
    - python3 -I /tmp/aap_evidence.py verify aap-evidence-sbom
  artifacts:
    when: always
    expire_in: 30 days
    paths: [aap-evidence-sbom/]
