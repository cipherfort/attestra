# .security/asvs.yaml: ASVS scope for this application (schemas/repo-contract/asvs.schema.json).
# target_level must be >= the tier's ASVS target (Tier 1 → 3, Tier 2 → 2, Tier 3/4 → 1). Checked by ASC-REQ-01.
# N/A entries are REQUESTS: they take effect only once approved in the platform.
schema_version: "1"
asvs_version: "5.0.0"
target_level: 3            # Claims API is Tier 1 (classification FR-3: public_large)
capabilities:
  web_frontend: true
  api: true
  file_handling: true      # customers upload supporting documents
  authentication: federated
  sessions: true
  self_contained_tokens: true
  oauth_oidc: [ client, resource_server ]
  webrtc: false
not_applicable:
  - ref: "V6.4"
    justification: "No local passwords: all authentication is federated to the organization's identity provider (OIDC)."
custom_requirements:
  - id: CUSTOM-01
    title: "Claim documents are malware-scanned before any downstream processing"
    source: threat_model
    verification: automated_test
